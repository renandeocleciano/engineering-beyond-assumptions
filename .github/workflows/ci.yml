name: CI
on: [pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: experiments
          POSTGRES_PASSWORD: experiments
          POSTGRES_DB: experiments
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U experiments -d experiments"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://experiments:experiments@localhost:5432/experiments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install '.[dev]'
      - run: ruff check .
      - run: mypy
      - run: alembic upgrade head
      - run: pytest
